name: Build and publish mutual fund report

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    # 13:15 UTC = 18:45 IST. Runs Monday-Friday after Indian market close.
    - cron: "15 13 * * 1-5"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Generate report
        run: python3 mf_daily_change.py --xlsx holdings_public.xlsx --no-open

      - name: Prepare Pages files
        run: |
          mkdir -p _site
          latest="$(ls -t reports/mf_daily_change_*.html | head -n 1)"
          cp "$latest" _site/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
