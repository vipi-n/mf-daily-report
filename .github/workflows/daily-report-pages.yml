name: Build and publish mutual fund report

on:
  workflow_dispatch:
  push:
    branches:
      - main
    schedule:
    # Temporary test: runs every 5 minutes. Remove after confirming schedule works.
    - cron: "*/5 * * * *"
    # 06:45 UTC = 12:15 IST. Midday update, Monday-Friday.
    - cron: "45 6 * * 1-5"
    # 13:15 UTC = 18:45 IST. After-market update, Monday-Friday.
    - cron: "15 13 * * 1-5"
    
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Generate report
        run: python3 mf_daily_change.py --input holdings_public.json --no-open

      - name: Send email summary
        continue-on-error: true
        env:
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: "587"
          SMTP_USER: ${{ secrets.EMAIL_ADDRESS }}
          SMTP_PASSWORD: ${{ secrets.GMAIL }}
          EMAIL_FROM: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_TO: ${{ secrets.EMAIL_ADDRESS }}
          REPORT_URL: https://vipi-n.github.io/mf-daily-report/
        run: python3 send_report_email.py

      - name: Prepare Pages files
        run: |
          mkdir -p _site
          latest="$(ls -t reports/mf_daily_change_*.html | head -n 1)"
          cp "$latest" _site/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
