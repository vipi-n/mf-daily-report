name: Schedule test

on:
  push:
    branches: [main]
  schedule:
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Print schedule time
        run: |
          echo "Schedule test fired at $(date -u)"
          echo "Event: $GITHUB_EVENT_NAME"
